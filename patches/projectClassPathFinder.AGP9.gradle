// Patched copy of the projectClassPathFinder.gradle bundled inside the
// kotlin-language-server jar (server/lib/shared-1.3.13.jar).
//
// WHY: AGP 9 removed BaseExtension.getBootClasspath() from the public android DSL,
// so the stock script aborted during Gradle import and the server ended up storing
// a one-jar classpath (every android.* symbol showed "Unresolved reference").
// Upstream issue: https://github.com/fwcd/kotlin-language-server/issues/487
// (open on 2026-09-23; server 1.3.13 ships no fix).
//
// NOTE: inside the jar the entry name must be exactly "projectClassPathFinder.gradle",
// so copy this file to /tmp/projectClassPathFinder.gradle before injecting it with zip.
//
// Recreate the patch after every kotlin-language-server update, because a fresh
// server.zip overwrites the jar. Steps: see the "kotlin-language-server: AGP 9
// classpath patch" section in README.md.
//
// Patched and verified on 2026-09-23 (AGP 9.4.1, Gradle 9.6.0, server 1.3.13).

allprojects { project ->
    task kotlinLSPProjectDeps { task ->
        doLast {
            System.out.println ""
            System.out.println "gradle-version $gradleVersion"
            System.out.println "kotlin-lsp-project ${project.name}"

            if (project.hasProperty('android')) {
                // AGP 9 removed BaseExtension.getBootClasspath() from the public DSL,
                // so resolve android.jar from the SDK location directly.
                try {
                    def sdkDir = null
                    def localProps = new File(project.rootDir, "local.properties")
                    if (localProps.exists()) {
                        def props = new Properties()
                        localProps.withInputStream { props.load(it) }
                        def configured = props.getProperty("sdk.dir")
                        if (configured) {
                            sdkDir = new File(configured)
                        }
                    }
                    if (sdkDir == null) {
                        def fromEnv = System.getenv("ANDROID_SDK_ROOT") ?: System.getenv("ANDROID_HOME")
                        if (fromEnv) {
                            sdkDir = new File(fromEnv)
                        }
                    }

                    def compileSdk = null
                    try {
                        compileSdk = project.android.compileSdk
                    } catch (Exception ignored) {
                    }

                    if (sdkDir != null && compileSdk != null) {
                        def androidJar = new File(sdkDir, "platforms/android-" + compileSdk + "/android.jar")
                        if (androidJar.exists()) {
                            System.out.println "kotlin-lsp-gradle $androidJar"
                        } else {
                            System.err.println "kotlin-lsp-android-jar missing: $androidJar"
                        }
                    } else {
                        System.err.println "kotlin-lsp-android-jar unresolved (sdkDir=$sdkDir compileSdk=$compileSdk)"
                    }
                } catch (Exception e) {
                    System.err.println "kotlin-lsp-android-bootclasspath failed: ${e.message}"
                }
            } else if (project.hasProperty('sourceSets')) {
                // Print the list of all dependencies jar files.
                try {
                    sourceSets.forEach {
                        try {
                            it.compileClasspath.forEach {
                                System.out.println "kotlin-lsp-gradle $it"
                            }
                        } catch (Exception ignored) {
                        }
                    }
                } catch (Exception e) {
                    System.err.println "kotlin-lsp-source-sets failed: ${e.message}"
                }
            }

            // Resolve every *CompileClasspath configuration. Covers AGP
            // (debugCompileClasspath, releaseCompileClasspath, ...), the plain Java
            // plugin (compileClasspath) and Kotlin multiplatform targets, replacing
            // the legacy applicationVariants loop that AGP 9 removed.
            try {
                // Snapshot first: resolving a configuration can register new ones,
                // which would throw ConcurrentModificationException while iterating.
                def configs = new ArrayList(project.configurations)
                configs.each { cfg ->
                    try {
                        if (cfg.canBeResolved && cfg.name.toLowerCase().endsWith("compileclasspath")) {
                            cfg.files.each {
                                System.out.println "kotlin-lsp-gradle $it"
                            }
                        }
                    } catch (Exception ignored) {
                    }
                }
            } catch (Exception e) {
                System.err.println "kotlin-lsp-compile-classpath failed: ${e.message}"
            }

            // handle kotlin multiplatform style dependencies if any
            try {
                def kotlinExtension = project.extensions.findByName("kotlin")
                if (kotlinExtension && kotlinExtension.hasProperty("targets")) {
                    kotlinExtension.targets.names.each {
                        def classpath = project.configurations.findByName("${it}CompileClasspath")
                        if (classpath != null) {
                            try {
                                classpath.files.each {
                                    System.out.println "kotlin-lsp-gradle $it"
                                }
                            } catch (Exception ignored) {
                            }
                        }
                    }
                }
            } catch (Exception e) {
                System.err.println "kotlin-lsp-kmp-classpath failed: ${e.message}"
            }
        }
    }

    task kotlinLSPAllGradleDeps {
        doLast {
            fileTree("$gradle.gradleHomeDir/lib")
                .findAll { it.toString().endsWith '.jar' }
                .forEach { System.out.println "kotlin-lsp-gradle $it" }
        }
    }
}
